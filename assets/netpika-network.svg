<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">netPika high-performance infrastructure</title>
  <desc id="desc">A futuristic network visualization connecting netPika infrastructure with trading, network intelligence and distributed compute.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070d"/>
      <stop offset="0.55" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#080612"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".12"/>
      <stop offset=".5" stop-color="#22d3ee" stop-opacity=".92"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity=".18"/>
    </linearGradient>
    <radialGradient id="core">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".14" stop-color="#67e8f9"/>
      <stop offset=".45" stop-color="#06b6d4" stop-opacity=".7"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M52 0H0V52" fill="none" stroke="#8be9fd" stroke-opacity=".055"/>
    </pattern>
  </defs>
  <rect width="1400" height="520" rx="30" fill="url(#bg)"/>
  <rect width="1400" height="520" rx="30" fill="url(#grid)"/>
  <g fill="none" stroke="url(#beam)" stroke-width="2">
    <path d="M700 314C565 265 405 213 214 163"/>
    <path d="M700 314C521 326 371 358 160 405"/>
    <path d="M700 314C864 258 1023 202 1205 145"/>
    <path d="M700 314C888 326 1042 362 1258 416"/>
    <path d="M700 314C700 250 700 198 700 132"/>
  </g>
  <g fill="#67e8f9" filter="url(#glow)">
    <circle cx="214" cy="163" r="5"/><circle cx="160" cy="405" r="5"/>
    <circle cx="1205" cy="145" r="5"/><circle cx="1258" cy="416" r="5"/><circle cx="700" cy="132" r="5"/>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" fill="#9ca3af" font-size="18" letter-spacing="2">
    <text x="164" y="137">TRADING</text><text x="92" y="444">BROKERS</text>
    <text x="1152" y="119">NETWORK</text><text x="1193" y="455">COMPUTE</text>
    <text x="650" y="100">LATENCY</text>
  </g>
  <circle cx="700" cy="314" r="82" fill="url(#core)" opacity=".36"/>
  <circle cx="700" cy="314" r="50" fill="#03060c" stroke="#67e8f9" stroke-width="2" filter="url(#glow)"/>
  <text x="700" y="327" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="42" font-weight="800" fill="#fff">nP</text>
  <text x="700" y="58" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" letter-spacing="7" fill="#67e8f9">NETPIKA</text>
  <text x="700" y="392" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="650" fill="#f8fafc">INFRASTRUCTURE FOR MARKETS THAT NEVER SLEEP</text>
  <text x="700" y="430" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" letter-spacing="2" fill="#94a3b8">TRADING VPS · MULTIPOINT CONNECTIVITY · DISTRIBUTED COMPUTE</text>
  <rect x="1" y="1" width="1398" height="518" rx="29" fill="none" stroke="#67e8f9" stroke-opacity=".18"/>
</svg>
