name: Build BTCPay ReturnOnProcessing

on:
  pull_request:
    paths:
      - 'tools/btcpay-returnonprocessing/**'
      - '.github/workflows/build-btcpay-returnonprocessing.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout netPika repo
        uses: actions/checkout@v4

      - name: Checkout BTCPay Server 2.4.3
        uses: actions/checkout@v4
        with:
          repository: btcpayserver/btcpayserver
          ref: v2.4.3
          path: tools/btcpay-returnonprocessing/submodules/btcpayserver

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build plugin
        run: |
          dotnet publish tools/btcpay-returnonprocessing/src/NetPika.ReturnOnProcessing/NetPika.ReturnOnProcessing.csproj \
            -c Release \
            -o tools/btcpay-returnonprocessing/out

      - name: Verify assembly
        run: |
          test -f tools/btcpay-returnonprocessing/out/NetPika.ReturnOnProcessing.dll
          ls -lah tools/btcpay-returnonprocessing/out

      - name: Package .btcpay
        run: |
          cd tools/btcpay-returnonprocessing/out
          zip -9 -r ../NetPika.ReturnOnProcessing.btcpay .
          cd -
          unzip -l tools/btcpay-returnonprocessing/NetPika.ReturnOnProcessing.btcpay

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetPika.ReturnOnProcessing
          path: tools/btcpay-returnonprocessing/NetPika.ReturnOnProcessing.btcpay
          if-no-files-found: error
